# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - lumen-db:/var/lib/postgresql/data

volumes:
  lumen-db:
